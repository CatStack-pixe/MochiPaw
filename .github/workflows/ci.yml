name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Check lint
        run: pnpm exec eslint src --max-warnings 1

      - name: Build frontend
        run: pnpm build:vite

      - name: Install browser smoke tools
        run: |
          npm install --prefix "$RUNNER_TEMP/mochipaw-browser" --no-package-lock --ignore-scripts playwright@1.55.1
          node "$RUNNER_TEMP/mochipaw-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Verify real model rendering and GPU texture release
        env:
          BROWSER_TEST_DIR: ${{ runner.temp }}/mochipaw-browser
        run: node scripts/rendererSmoke.mjs

      - name: Upload renderer smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-smoke
          path: renderer-smoke-results/
          if-no-files-found: ignore

      - name: Check portable packaging script
        run: node --check scripts/packagePortable.mjs

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-22.04
            inputd: true
          - name: Windows
            runner: windows-2022
            inputd: false
          - name: macOS
            runner: macos-14
            inputd: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: pnpm build:icon

      - name: Install Linux dependencies
        if: matrix.inputd
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.name }}

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --locked

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --locked

      - name: Test explicit storage directories
        env:
          TAURI_STORE_WORKSPACE: 'true'
        run: cargo test --manifest-path vendor/tauri-store/Cargo.toml --test paths --features unstable-migration

      - name: Test Linux input service
        if: matrix.inputd
        run: cargo test -p mochi-paw --features inputd --bin mochi-paw-inputd --locked

      - name: Build isolated Windows installer fixtures
        if: runner.os == 'Windows'
        run: python -X utf8 scripts/testInstallerDataAccess.py build

      - name: Test installer data access as an ordinary user
        if: runner.os == 'Windows'
        run: python -X utf8 scripts/testInstallerDataAccess.py run

      - name: Upload installer smoke evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-data-access-evidence
          path: |
            target/installer-data-smoke/*.log
            target/installer-data-smoke/*.json
          if-no-files-found: ignore

  portable-smoke:
    name: Portable Unicode smoke
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Package from a special-character path
        shell: pwsh
        run: ./scripts/testPortableUnicode.ps1
