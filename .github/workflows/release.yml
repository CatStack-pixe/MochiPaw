name: MochiPaw Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-app:
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # tauri-action invokes pnpm directly; this separator belongs to Tauri's Cargo runner.
          - platform: macos-latest
            target: aarch64-apple-darwin
            tauriArgs: --target aarch64-apple-darwin -- --locked
          - platform: macos-latest
            target: x86_64-apple-darwin
            tauriArgs: --target x86_64-apple-darwin -- --locked
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            tauriArgs: --target x86_64-pc-windows-msvc --bundles msi,nsis -- --locked
            portable: true
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauriArgs: --target x86_64-unknown-linux-gnu -- --locked
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            tauriArgs: --target aarch64-unknown-linux-gnu -- --locked
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf xdg-utils

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: . -> target

      - name: Install front-end dependencies
        run: |
          pnpm config set registry https://registry.npmjs.org
          pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm exec tsx scripts/checkReleaseVersion.ts "${{ github.ref_name }}"

      - name: Generate Tauri icons
        if: startsWith(matrix.platform, 'ubuntu')
        run: pnpm build:icon

      - name: Build Wayland input service
        if: startsWith(matrix.platform, 'ubuntu')
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --features inputd --bin mochi-paw-inputd --locked

      - name: Generate contributors manifest
        run: pnpm generate:contributors

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          CI: false
          PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MochiPaw ${{ github.ref_name }}
          releaseBody: ''
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.tauriArgs }}

      - name: Build portable Windows archive
        if: matrix.portable
        run: pnpm build:portable -- --skip-build --target ${{ matrix.target }}

      - name: Upload portable Windows archive
        if: matrix.portable
        uses: actions/upload-artifact@v4
        with:
          name: MochiPaw-portable-windows-x86_64
          path: target/${{ matrix.target }}/release/bundle/portable/*.zip
          if-no-files-found: error

      - name: Attach portable archive to release
        if: matrix.portable && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: target/${{ matrix.target }}/release/bundle/portable/*.zip
