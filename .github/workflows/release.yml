name: MochiPaw Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-app:
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # tauri-action invokes pnpm directly; this separator belongs to Tauri's Cargo runner.
          - platform: macos-latest
            target: aarch64-apple-darwin
            tauriArgs: --target aarch64-apple-darwin -- --locked
          - platform: macos-latest
            target: x86_64-apple-darwin
            tauriArgs: --target x86_64-apple-darwin -- --locked
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            tauriArgs: --target x86_64-pc-windows-msvc --bundles msi,nsis -- --locked
            portable: true
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauriArgs: --target x86_64-unknown-linux-gnu -- --locked
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            tauriArgs: --target aarch64-unknown-linux-gnu -- --locked
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf xdg-utils

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: . -> target

      - name: Install front-end dependencies
        run: |
          pnpm config set registry https://registry.npmjs.org
          pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm exec tsx scripts/checkReleaseVersion.ts "${{ github.ref_name }}"

      - name: Generate Tauri icons
        if: startsWith(matrix.platform, 'ubuntu')
        run: pnpm build:icon

      - name: Build Wayland input service
        if: startsWith(matrix.platform, 'ubuntu')
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --features inputd --bin mochi-paw-inputd --locked

      - name: Generate contributors manifest
        run: pnpm generate:contributors

      - name: Validate updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node <<'NODE'
          const requiredSecrets = [
            'TAURI_SIGNING_PRIVATE_KEY',
            'TAURI_SIGNING_PRIVATE_KEY_PASSWORD',
          ];

          for (const name of requiredSecrets) {
            const value = process.env[name] ?? '';
            if (!value) {
              throw new Error(`${name} is empty`);
            }
            if (value.codePointAt(0) === 0xfeff) {
              throw new Error(`${name} starts with a UTF-8 BOM`);
            }
          }

          const decodedKey = Buffer.from(
            process.env.TAURI_SIGNING_PRIVATE_KEY,
            'base64',
          ).toString('utf8');
          if (!decodedKey.startsWith('untrusted comment: rsign encrypted secret key\n')) {
            throw new Error('TAURI_SIGNING_PRIVATE_KEY is not a Tauri updater private key');
          }
          NODE

      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        env:
          CI: false
          PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MochiPaw ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.tauriArgs }}

      - name: Upload updater metadata fragment
        uses: actions/upload-artifact@v4
        with:
          name: updater-metadata-${{ matrix.target }}
          path: latest.json
          if-no-files-found: error

      - name: Build portable Windows archive
        if: matrix.portable
        run: pnpm build:portable -- --skip-build --target ${{ matrix.target }}

      - name: Upload portable Windows archive
        if: matrix.portable
        uses: actions/upload-artifact@v4
        with:
          name: MochiPaw-portable-windows-x86_64
          path: target/${{ matrix.target }}/release/bundle/portable/*.zip
          if-no-files-found: error

      - name: Attach portable archive to release
        if: matrix.portable && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: target/${{ matrix.target }}/release/bundle/portable/*.zip

  finalize-release:
    name: Verify updater metadata and publish
    needs: build-app
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download updater metadata fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-metadata-*
          path: release-metadata/fragments

      - name: Download release assets
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_id="$(
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id' |
              head -n 1
          )"
          test -n "$release_id"
          gh api "repos/$REPOSITORY/releases/$release_id/assets?per_page=100" > release-metadata/assets.json

      - name: Verify and rename updater metadata
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_id="$(
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id' |
              head -n 1
          )"
          test -n "$release_id"
          gh api "repos/$REPOSITORY/releases/$release_id" --jq '.body // ""' > release-metadata/release-notes.md
          version="${RELEASE_TAG#v}"
          node scripts/verifyUpdaterMetadata.mjs \
            release-metadata/fragments \
            release-metadata/assets.json \
            "$version" \
            release-metadata/latest-v2.json \
            release-metadata/release-notes.md

      - name: Replace updater metadata asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp release-metadata/latest-v2.json release-metadata/latest.json
          gh release upload "$RELEASE_TAG" release-metadata/latest-v2.json --clobber
          gh release upload "$RELEASE_TAG" release-metadata/latest.json --clobber

      - name: Verify release assets and publish
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_id="$(
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id' |
              head -n 1
          )"
          test -n "$release_id"
          assets="$(gh api "repos/$REPOSITORY/releases/$release_id/assets?per_page=100")"
          test "$(jq '[.[].name | select(. == "latest-v2.json")] | length' <<< "$assets")" -eq 1
          test "$(jq '[.[].name | select(. == "latest.json")] | length' <<< "$assets")" -eq 1
          gh release edit "$RELEASE_TAG" --draft=false
